[package]
name = "nysos"
version = "0.1.0"
edition = "2024"
description = "Multi-pane scripted and interactive terminal demonstrations"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
crossterm = "0.28"
portable-pty = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tui-textarea = "0.7"
url = "2"
tempfile = "3"

[dev-dependencies]
clap_mangen = "0.2"
