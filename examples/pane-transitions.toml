# Run: nysos --config examples/pane-transitions.toml
# Enter in the cue list executes the selected cue. Prefix, n steps one command.
# Each command targets a stable pane ID and may change that pane's title/scheme.
# Omitted panes keep their current appearance and shell state.
features = ["line-numbers"]
line_numbers = false
title = "Independent pane titles and themes"
header = true
cue_list = true
cue_width = 30
# Service fills the left column; Observer and Notes share the right column.
[layout]
direction = "columns"
children = [
  { pane = "service" },
  { direction = "rows", children = [{ pane = "observer" }, { pane = "notes" }] },
]

[[panes]]
id = "service"
title = "Service · ready"
shell = "/bin/sh"
scheme = "ocean"
weight = 1

[[panes]]
id = "observer"
title = "Observer · ready"
shell = "/bin/sh"
scheme = "mono"
weight = 1

[[panes]]
id = "notes"
title = "Notes · ready"
shell = "/bin/sh"
scheme = "forest"
weight = 1

[[queues]]
name = "Introduce all three shells"
description = "All three panes get new titles, themes, and commands. Variables persist in their independent shells."
commands = [
  { pane = "service", title = "Service · setup", scheme = "forest", command = "DEMO_SERVICE=nysos; export DEMO_SERVICE; printf 'Service: %s\\n' \"$DEMO_SERVICE\"; pwd" },
  { pane = "observer", title = "Observer · environment", scheme = "ocean", command = "DEMO_ROLE=observer; export DEMO_ROLE; printf 'Role: %s\\n' \"$DEMO_ROLE\"; uname -s" },
  { pane = "notes", title = "Notes · demo guide", scheme = "ocean", command = "printf 'Service on the left; Observer above Notes on the right.\\n'" },
]

[[queues]]
name = "Service only"
description = "Widen the service column and update its title/theme. Observer and Notes retain their titles, themes, and shell state."
layout = { direction = "columns", children = [{ pane = "service", weight = 2 }, { direction = "rows", children = [{ pane = "observer", weight = 1 }, { pane = "notes", weight = 1 }] }] }
commands = [
  { pane = "service", title = "Service · inspecting", scheme = "ember", command = "printf 'Inspecting %s in %s\\n' \"$DEMO_SERVICE\" \"$PWD\"; ls -a" },
]

[[queues]]
name = "Observer only"
description = "Give Observer more height in the right column and update its title/theme. The original shell is still running."
layout = { direction = "columns", children = [{ pane = "service", weight = 1 }, { direction = "rows", children = [{ pane = "observer", weight = 2 }, { pane = "notes", weight = 1 }] }] }
commands = [
  { pane = "observer", title = "Observer · healthy", scheme = "forest", command = "printf 'Role still set: %s\\nSimulated health check: OK\\n' \"$DEMO_ROLE\"; date" },
]

[[queues]]
name = "Title only"
description = "Change the service title and execute a command. Omitting scheme retains its ember theme."
commands = [
  { pane = "service", title = "Service · shell state", command = "printf 'Same service shell: %s\\n' \"$DEMO_SERVICE\"; printf 'Working directory: '; pwd" },
]

[[queues]]
name = "Theme only"
description = "Change only the Notes theme and execute a command. Its demo guide title remains."
commands = [
  { pane = "notes", scheme = "ember", command = "printf 'Drag borders to resize; Ctrl-G then < or > adjusts width, - or + adjusts height.\\n'" },
]

[[queues]]
name = "Finish together"
description = "All three panes receive distinct final titles, themes, and commands. Their stable IDs remain unchanged."
layout = { direction = "columns", children = [{ pane = "service", weight = 1 }, { direction = "rows", children = [{ pane = "observer", weight = 1 }, { pane = "notes", weight = 1 }] }] }
commands = [
  { pane = "service", title = "Service · complete", scheme = "ocean", command = "printf 'Finished demonstration for %s\\n' \"$DEMO_SERVICE\"" },
  { pane = "observer", title = "Observer · complete", scheme = "ember", command = "printf 'Finished observation as %s\\n' \"$DEMO_ROLE\"" },
  { pane = "notes", title = "Notes · complete", scheme = "forest", command = "printf 'Demo complete. Replay any cue with Enter.\\n'" },
]
